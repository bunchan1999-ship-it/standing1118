<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしたちは、衆議院比例代表の定数削減に反対します｜京都の大学人有志</title>
  <style>
    :root {
      --primary-color: #c92a2a;
      --navy-color: #1a365d;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --border-color: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.8;
      color: var(--text-color);
      background-color: var(--bg-color);
      padding: 16px;
    }
    .container {
      max-width: 820px;
      margin: 0 auto 40px auto;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border-color);
    }
    .header-banner {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #fff;
      padding: 36px 24px;
      text-align: center;
    }
    .header-banner h1 {
      font-size: 1.6rem;
      line-height: 1.4;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .header-banner .subtitle {
      font-size: 1rem;
      color: #cbd5e1;
    }
    .content {
      padding: 28px 24px;
    }
    /* アクションボックス（街宣告知） */
    .action-box {
      background: #fff5f5;
      border: 2px solid var(--primary-color);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 32px;
    }
    .action-badge {
      display: inline-block;
      background-color: var(--primary-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .action-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #991b1b;
      margin-bottom: 12px;
    }
    .action-details {
      list-style: none;
      font-size: 1.05rem;
    }
    .action-details li {
      padding: 6px 0;
      border-bottom: 1px dashed #fca5a5;
    }
    .action-details li:last-child {
      border-bottom: none;
    }
    .action-details strong {
      color: #7f1d1d;
    }
    /* 賛同ボタンセクション */
    .cta-area {
      text-align: center;
      margin: 36px 0;
      padding: 24px;
      background: #eff6ff;
      border-radius: 10px;
      border: 1px solid #bfdbfe;
    }
    .cta-btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .cta-btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }
    /* 声明文エリア */
    .statement-section {
      margin-top: 24px;
    }
    .statement-section h2 {
      font-size: 1.25rem;
      color: var(--navy-color);
      border-left: 5px solid var(--navy-color);
      padding-left: 12px;
      margin-bottom: 20px;
    }
    .statement-text p {
      margin-bottom: 18px;
      text-align: justify;
    }
    /* 呼びかけ人リスト */
    .member-box {
      margin-top: 32px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px 24px;
    }
    .member-box h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #334155;
    }
    .member-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px 16px;
      font-size: 0.95rem;
    }
    .contact-info {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.9rem;
      color: #475569;
    }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
